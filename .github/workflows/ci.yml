name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest

  torch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model test dependencies
        run: >-
          python -m pip install -e ".[dev]" "torch>=2.5,<3" "captum>=0.7,<1"
          "minisom>=2.3.6,<3" "matplotlib>=3.9,<4"
      - name: Run CNN, training, and attribution tests
        run: >-
          python -m pytest tests/test_model.py tests/test_training.py tests/test_grad_cam.py
          tests/test_integrated_gradients.py tests/test_occlusion.py
          tests/test_feature_deletion.py tests/test_stability.py
          tests/test_mapping.py tests/test_som_diagnostic.py

  tree-shap-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated tree explanation dependencies
        run: >-
          python -m pip install -e ".[dev]" "shap==0.52.0" "xgboost==3.4.1"
          "matplotlib>=3.9,<4"
      - name: Run tree explanation and integrity tests
        run: python -m pytest tests/test_tree_shap.py tests/test_tree_shap_stability.py
