method: integrated_gradients
target: predicted_class
integration_method: gausslegendre
n_steps: 128
retry_n_steps: 1024
internal_batch_size: 64
sample_batch_size: 16
baselines:
  - zero
  - training_mean
  - training_median
baseline_equivalence_atol: 0.0000001
absolute_convergence_tolerance: 0.0001
relative_convergence_tolerance: 0.05
ranking: absolute_magnitude
retain_signed_values: true
top_k:
  - 5
  - 10
