experiment:
  name: breast-cancer-fixed-split-tabular-baselines
  data_split_seed: 42
  model_seeds:
    - 7
    - 42
    - 2026
  expected_split_sha256: 79e85d4ceae692441b84f6921174e89879dc7eca4e27e8e6f6744799a67aa7cb

dataset:
  name: breast_cancer_wisconsin
  test_size: 0.15
  validation_size: 0.15
  stratify: true

preprocessing:
  numerical_scaler: standard
  fit_on_training_only: true
  reason: match_frozen_grid_pipeline

selection:
  metric: validation_macro_f1
  tie_break: first_candidate_in_config_order
  refit_on_train_plus_validation: false
  test_evaluations_per_selected_model: 1

models:
  random_forest:
    importance_definition: mean_decrease_impurity
    fixed_parameters:
      n_estimators: 400
      criterion: gini
      bootstrap: true
      class_weight: null
    search_grid:
      max_depth:
        - null
        - 6
        - 12
      min_samples_leaf:
        - 1
        - 3
      max_features:
        - sqrt
  xgboost:
    importance_definition: gain
    fixed_parameters:
      objective: binary:logistic
      eval_metric: logloss
      tree_method: hist
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      importance_type: gain
      verbosity: 0
    search_grid:
      n_estimators:
        - 100
        - 300
      max_depth:
        - 2
        - 4
      learning_rate:
        - 0.03
        - 0.1

global_importance:
  scope: global_model_native_only
  compare_magnitudes_across_model_families: false
  local_tree_explanations_included: false
  top_k:
    - 5
    - 10
