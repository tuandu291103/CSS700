experiment:
  name: breast-cancer-grid-pilot
  seed: 42

dataset:
  name: breast_cancer_wisconsin
  test_size: 0.15
  validation_size: 0.15
  stratify: true

preprocessing:
  numerical_scaler: standard
  fit_on_training_only: true

encoding:
  method: grid
  ordering: original_column_order
  padding_value: 0.0

model:
  architecture: small_cnn
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 8

explanations:
  target: predicted_class
  methods:
    - grad_cam
    - integrated_gradients
    - occlusion_sensitivity
  integrated_gradients_baselines:
    - zero
    - training_mean
  top_k:
    - 5
    - 10
