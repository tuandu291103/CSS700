[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "css700"
version = "0.1.0"
description = "Feature-level interpretability experiments for tabular-to-image CNNs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
research = [
  "captum>=0.7,<1",
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "lime>=0.2.0.1,<1",
  "matplotlib>=3.9,<4",
  "minisom>=2.3.6,<3",
  "seaborn>=0.13,<1",
  "shap>=0.46,<1",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "xgboost>=2.1,<4",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
css700 = "css700.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
